# Distributed load test on GitHub's runners.
#
# Why a matrix: every per-IP limit in the API is a separate bucket per source
# address. One machine measures its own bucket and calls it a day. N runners are
# N addresses, so together they load the SERVER rather than one bucket — which is
# the thing k6 Cloud sells, done with CI minutes instead.
#
# Safety rules live in lib/targets.js and are asserted at script startup: nothing
# here may reach VAO, whose daily allowance is contractual and fail-closed.

name: distributed load test

on:
  workflow_dispatch:
    inputs:
      machines:
        description: "Parallel runners (each gets its own public IP)"
        default: "8"
      rate:
        description: "Target requests/second PER machine"
        default: "100"
      base:
        description: "Base URL under test"
        default: "https://api.oeffigo.app"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.build.outputs.list }}
    steps:
      - id: build
        run: |
          n="${{ github.event.inputs.machines }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -lt 1 ] || [ "$n" -gt 20 ]; then
            echo "machines must be 1..20" >&2; exit 1
          fi
          echo "list=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  loadtest:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.prepare.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      - name: Identify this runner
        run: |
          echo "machine #${{ matrix.machine }}"
          echo "public IP: $(curl -sS --max-time 10 https://api.ipify.org || echo unknown)"

      - uses: grafana/setup-k6-action@v1

      # Connection-level facts first, while the runner is otherwise idle — a
      # cold-handshake measurement taken during a load run measures the load.
      - name: Probe (connection, cache, protocol)
        env:
          BASE: ${{ github.event.inputs.base }}
          MACHINE: ${{ matrix.machine }}
        run: |
          mkdir -p results
          ./scripts/probe.sh > "results/probe-${{ matrix.machine }}.json"
          cat "results/probe-${{ matrix.machine }}.json"

      - name: Load test
        env:
          BASE: ${{ github.event.inputs.base }}
          MACHINE: ${{ matrix.machine }}
          RATE: ${{ github.event.inputs.rate }}
        run: k6 run -e BASE="$BASE" -e RATE="$RATE" -e MACHINE="$MACHINE" scripts/loadtest.k6.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.machine }}
          path: results/
          retention-days: 7

  report:
    needs: loadtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Aggregate
        run: |
          node scripts/aggregate.mjs artifacts | tee report.txt
          {
            echo '## ÖffiGo API — distributed load test'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.txt
            report.json
